name: CI & Release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar a versão atual (somente na branch padrão)"
        type: boolean
        required: true
        default: false

# Tags are created by this workflow; tag pushes do not start a second build.
# PRs can be superseded. A running release must not be cancelled mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Testes e configuração
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Checkout do commit e histórico
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Python para testes do statusline
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar dependências travadas
        run: npm ci --no-audit --no-fund

      - name: Verificar versões
        run: npm run release:check

      - name: Testes de lógica, design, statusline e release
        run: npm test

      - name: TypeScript e build web
        run: npm run build

      - name: Validar o próprio workflow (actionlint com SHA-256)
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/ci-release.yml

      - name: Planejar publicação sem criar tags ou releases
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.mjs prepare

  macos:
    name: macOS · testes e instalador universal
    needs: check
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Explicit paths avoid machine-specific ~/.cargo/config.toml settings.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout do mesmo commit validado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Rust fixado e duas arquiteturas Apple
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          cargo --version
          xcodebuild -version

      - name: Restaurar cache Cargo
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            src-tauri/target/debug
            src-tauri/target/aarch64-apple-darwin/release
            src-tauri/target/x86_64-apple-darwin/release
          key: macos-15-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            macos-15-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-

      - name: Dependências e recursos web necessários ao Rust
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Formatação Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy (warnings bloqueiam a release)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Testes Rust sem contas ou credenciais de provedores
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build e verificação (assinatura ad hoc, sem credenciais)
        if: >-
          !(needs.check.outputs.publish == 'true' && vars.APPLE_SIGNING_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)))
        env:
          SIGNING_ENABLED: "false"
        run: node scripts/ci/macos.mjs build "$RUNNER_TEMP/distribution"

      - name: Build assinado e notarizado (somente release confiável)
        # Event/branch checks are independent of script-produced outputs.
        if: >-
          needs.check.outputs.publish == 'true' && vars.APPLE_SIGNING_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          SIGNING_ENABLED: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/ci/macos.mjs build "$RUNNER_TEMP/distribution"

      - name: Guardar cache somente na branch padrão confiável
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            src-tauri/target/debug
            src-tauri/target/aarch64-apple-darwin/release
            src-tauri/target/x86_64-apple-darwin/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Guardar pacotes verificados
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal-${{ needs.check.outputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publicar tag e GitHub Release
    needs: [check, macos]
    # Check the event and branch here as well, not only a script-produced output.
    if: >-
      needs.check.outputs.publish == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: notchusage-publish
      cancel-in-progress: false
    steps:
      - name: Checkout do commit compilado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js (sem instalar dependências no job com escrita)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Baixar somente o artefato deste build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/distribution
          digest-mismatch: error

      - name: Conferir hashes, gerar notas, criar tag e publicar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.check.outputs.commit }}
        run: node scripts/ci/release.mjs publish "$RUNNER_TEMP/distribution"
