name: CI & Release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the current version from the default branch"
        type: boolean
        required: true
        default: false

# This workflow creates tags, so tag pushes do not start another build.
# Pull request runs can be superseded. Release uploads must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tests and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out commit and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Python for statusline tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify manifest versions
        run: npm run release:check

      - name: Run logic, design, statusline, and release tests
        run: npm test

      - name: Run TypeScript and web build
        run: npm run build

      - name: Validate workflow with actionlint and SHA256
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/ci-release.yml

      - name: Plan publication without remote changes
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.mjs prepare

  macos:
    name: macOS tests and universal package
    needs: check
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Explicit paths avoid machine specific Cargo settings.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pinned Rust and both Apple architectures
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          cargo --version
          xcodebuild -version

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            src-tauri/target/debug
            src-tauri/target/aarch64-apple-darwin/release
            src-tauri/target/x86_64-apple-darwin/release
          key: macos-15-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            macos-15-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-

      - name: Install dependencies and build web assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests without provider credentials
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build and verify with ad hoc signing
        if: >-
          !(needs.check.outputs.publish == 'true' && vars.APPLE_SIGNING_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)))
        env:
          SIGNING_ENABLED: "false"
        run: node scripts/ci/macos.mjs build "$RUNNER_TEMP/distribution"

      - name: Build, sign, and notarize a trusted release
        # Event and branch checks are independent from script outputs.
        if: >-
          needs.check.outputs.publish == 'true' && vars.APPLE_SIGNING_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          SIGNING_ENABLED: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/ci/macos.mjs build "$RUNNER_TEMP/distribution"

      - name: Save Cargo cache from the trusted default branch
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            src-tauri/target/debug
            src-tauri/target/aarch64-apple-darwin/release
            src-tauri/target/x86_64-apple-darwin/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Upload verified packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal-${{ needs.check.outputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tag and GitHub Release
    needs: [check, macos]
    # Check the event and branch again before granting write permission.
    if: >-
      needs.check.outputs.publish == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: cooldown-bar-publish
      cancel-in-progress: false
    steps:
      - name: Check out the compiled commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js without dependency installation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download the matching build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/distribution
          digest-mismatch: error

      - name: Verify hashes, generate notes, create tag, and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.check.outputs.commit }}
        run: node scripts/ci/release.mjs publish "$RUNNER_TEMP/distribution"
