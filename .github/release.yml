# GitHub uses these labels when generating pull request release notes.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: "Breaking changes"
      labels: ["breaking-change"]
    - title: "Security"
      labels: ["security"]
    - title: "Features"
      labels: ["feature", "enhancement"]
    - title: "Fixes"
      labels: ["bug", "fix"]
    - title: "Performance"
      labels: ["performance"]
    - title: "Dependencies"
      labels: ["dependencies"]
    - title: "Build and automation"
      labels: ["ci", "build"]
    - title: "Documentation"
      labels: ["documentation"]
    - title: "Other changes"
      labels: ["*"]
